# Example 1: HP Server
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: hp-server-01
  namespace: openshift-machine-api
spec:
  serverName: ocp4-roi-rf-compute-01  # Server name in HP OneView
  infraEnv: "ocp4-roi-infraenv"        # Required: InfraEnv for agent-based installation
  server_vendor: HP                    # HP, DELL, or CISCO (case-insensitive)

---
# Example 2: Dell Server with VLAN
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: dell-server-01
  namespace: inventory
spec:
  serverName: ocp4-test1             # Server name in Dell OME
  infraEnv: "classic-baremetal"      # Required: InfraEnv name
  server_vendor: DELL
  networkConfig:
    vlanId: 24                       # Required for Dell; triggers NMStateConfig creation

---
# Example 3: Dell Server with vlanId + NIC/MAC override
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: dell-special-01
  namespace: inventory
spec:
  serverName: ocp4-special-node     # Server name in Dell OME
  infraEnv: "classic-baremetal"
  server_vendor: DELL
  networkConfig:
    vlanId: 24                       # Required for Dell
    nicName: "ens5f0np0"            # Optional: overrides profile lookup — must pair with macIndex
    macIndex: "3"                   # Optional: 0-based index into interface list

---
# Example 4: Cisco UCS Server
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: cisco-server-01
  namespace: default
spec:
  serverName: "my-ucs-server"        # Server name in UCS Central
  namespace: "baremetal"             # Optional: target namespace for BareMetalHost
  infraEnv: "my-infraenv"            # Required: InfraEnv name
  server_vendor: CISCO
  labels:                            # Optional: additional labels for BareMetalHost
    environment: "production"
    cluster: "my-cluster"
