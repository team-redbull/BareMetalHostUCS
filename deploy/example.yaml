# vlanId under networkConfig is REQUIRED for every vendor — the operator creates a
# bonded (802.3ad) NMStateConfig for all of them. Bond members come from the server
# profile ConfigMap unless overridden per-host with nicNames + macIndices.

# Example 1: HP Server
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: hp-server-01
  namespace: openshift-machine-api
spec:
  serverName: ocp4-roi-rf-compute-01  # Server name in HP OneView
  infraEnv: "ocp4-roi-infraenv"        # Required: InfraEnv for agent-based installation
  server_vendor: HP                    # HP, DELL, CISCO, or INTERSIGHT (case-insensitive)
  networkConfig:
    vlanId: 24                         # Required for all vendors

---
# Example 2: Dell Server
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: dell-server-01
  namespace: inventory
spec:
  serverName: ocp4-test1             # Server name in Dell OME
  infraEnv: "classic-baremetal"      # Required: InfraEnv name
  server_vendor: DELL
  networkConfig:
    vlanId: 24                       # Required for all vendors

---
# Example 3: Dell Server with per-host bonded NIC/MAC override
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: dell-special-01
  namespace: inventory
spec:
  serverName: ocp4-special-node     # Server name in Dell OME
  infraEnv: "classic-baremetal"
  server_vendor: DELL
  networkConfig:
    vlanId: 24
    nicNames: ["ens5f0np0", "ens5f1np1"]  # bond members (overrides profile lookup)
    macIndices: ["3", "4"]                # each: "first", "last", or 0-based integer

---
# Example 4: Cisco UCS Server
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: cisco-server-01
  namespace: default
spec:
  serverName: "my-ucs-server"        # Server name in UCS Central
  namespace: "baremetal"             # Optional: target namespace for BareMetalHost
  infraEnv: "my-infraenv"            # Required: InfraEnv name
  server_vendor: CISCO
  networkConfig:
    vlanId: 30                       # Required for all vendors
  labels:                            # Optional: additional labels for BareMetalHost
    environment: "production"
    cluster: "my-cluster"

---
# Example 5: Cisco Intersight Server
apiVersion: infra.example.com/v1alpha1
kind: BareMetalHostGenerator
metadata:
  name: intersight-server-01
  namespace: default
spec:
  serverName: "my-intersight-server"  # Server name in Cisco Intersight
  infraEnv: "my-infraenv"             # Required: InfraEnv name
  server_vendor: INTERSIGHT
  networkConfig:
    vlanId: 30                        # Required for all vendors
