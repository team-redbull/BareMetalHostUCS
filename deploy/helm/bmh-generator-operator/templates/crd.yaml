apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: baremetalhostgenerators.infra.example.com
spec:
  group: infra.example.com
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - infraEnv
            properties:
              serverName:
                type: string
                description: "Name of the server to look up in management systems"
              namespace:
                type: string
                description: "Target namespace for the BareMetalHost resource"
              infraEnv:
                type: string
                description: "InfraEnv name for the BareMetalHost"
              labels:
                type: object
                additionalProperties:
                  type: string
                description: "Additional labels to apply to the BareMetalHost"
              server_vendor:
                type: string
                pattern: "(?i)^(HP|DELL|CISCO|INTERSIGHT)$"
                description: "Server vendor type: HP, DELL, CISCO, or INTERSIGHT (case-insensitive)."
              networkConfig:
                type: object
                description: "Network configuration for this host. vlanId is REQUIRED for all vendors. nicNames and macIndices are optional overrides for the bonded NICs and must be provided together with equal length (one entry per bond member)."
                properties:
                  vlanId:
                    type: integer
                    minimum: 1
                    maximum: 4094
                    description: "VLAN ID for the NMStateConfig (1-4094). Required for all vendors."
                  nicNames:
                    type: array
                    items:
                      type: string
                    description: "Bond member NIC names (e.g. [ens8f0np0, ens8f1np1]). Overrides server profile lookup. Must be set with macIndices (same length)."
                  macIndices:
                    type: array
                    items:
                      type: string
                    description: "MAC selection per bond member — each 'first', 'last', or 0-based integer (e.g. ['0','1']). Parallel to nicNames."
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Processing", "Buffered", "Completed", "Failed"]
                description: "Current phase of the BareMetalHost generation"
              message:
                type: string
                description: "Human-readable message about the current status"
              bufferedAt:
                type: string
                description: "ISO timestamp when the server was buffered"
              macAddress:
                type: string
                description: "Primary MAC address (bond boot NIC) discovered from management system"
              macAddresses:
                type: array
                items:
                  type: string
                description: "All NIC MAC addresses (bond members) discovered from management system"
              ipmiAddress:
                type: string
                description: "IPMI/management IP address discovered"
              bmhName:
                type: string
                description: "Name of the created BareMetalHost resource"
              bmhNamespace:
                type: string
                description: "Namespace of the created BareMetalHost resource"
              serverVendor:
                type: string
                description: "Server vendor type detected or specified (HP, DELL, CISCO, INTERSIGHT)"
              vlanId:
                type: string
                description: "VLAN ID applied to the NMStateConfig"
              selectedNicNames:
                type: array
                items:
                  type: string
                description: "Effective NIC names used for this host (from spec.networkConfig or server profile)"
              selectedMacIndices:
                type: array
                items:
                  type: string
                description: "Effective MAC indices used for this host (from spec.networkConfig or server profile)"
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Server
      type: string
      jsonPath: .spec.serverName
    - name: Vendor
      type: string
      jsonPath: .spec.server_vendor
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: BMH
      type: string
      jsonPath: .status.bmhName
    - name: BMC
      type: string
      jsonPath: .status.ipmiAddress
      description: "BMC/IPMI address of the server"
    - name: MAC
      type: string
      jsonPath: .status.macAddress
      description: "MAC address of the server"
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: baremetalhostgenerators
    singular: baremetalhostgenerator
    kind: BareMetalHostGenerator
    shortNames:
    - bmhgen