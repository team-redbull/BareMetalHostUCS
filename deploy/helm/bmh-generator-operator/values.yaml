# Default values for bmh-generator-operator

# Container image configuration
image:
  repository: quay.io/your-org/bmh-generator-operator
  pullPolicy: IfNotPresent
  tag: "1.0.0"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Operator configuration
operator:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  logLevel: INFO
  # Buffer management
  maxAvailableServers: 20
  bufferCheckInterval: 30 # seconds
  # Resource deletion control
  # When true, deletes BMH, Secret, and NMStateConfig when BareMetalHostGenerator is deleted
  # When false, preserves resources for debugging or manual cleanup
  deleteResourcesOnDelete: true
  # Number of replica pods
  replicas: 1
  # Namespace to deploy operator (defaults to release namespace)
  namespace: ""
# Server profile configuration — server type → bonded NIC profiles.
# Patterns are matched case-insensitively against server names (first match wins).
# nic_names/mac_indices are parallel lists; two entries build an 802.3ad (LACP)
# bond, one entry yields a single-NIC config. Adjust NIC names to your hardware.
# Add new server types here and upgrade the Helm release — no image rebuild needed.
serverProfiles:
  profiles:
    - pattern: "h100"
      nic_names: ["ens8f0np0", "ens8f1np1"]
      mac_indices: ["2", "3"]
    - pattern: "h200"
      nic_names: ["ens33f0np0", "ens33f1np1"]
      mac_indices: ["2", "3"]
    - pattern: "10tb-"
      nic_names: ["ens2f0np0", "ens2f1np1"]
      mac_indices: ["last", "first"]
    - default: true
      nic_names: ["eno12399np0", "eno12409np1"]
      mac_indices: ["first", "last"]

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "bmh-generator-operator"
# RBAC
rbac:
  create: true
# Pod Security Context
podSecurityContext:
  runAsNonRoot: false
  # fsGroup: 2000
# Container Security Context
securityContext:
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
# Node selector
nodeSelector: {}
# Tolerations
tolerations: []
# Affinity
affinity: {}
# Liveness probe
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
# Readiness probe (disabled by default as operator uses liveness only)
readinessProbe:
  enabled: false
# HP OneView Configuration
hpOneView:
  enabled: false
  # IP address of HP OneView instance
  ip: ""
  # Username for HP OneView
  username: "administrator"
  # Password for HP OneView
  password: ""
  # BMC credentials for HP iLO
  bmc:
    username: "Administrator"
    password: ""
# Cisco UCS Configuration
ciscoUCS:
  enabled: false
  # UCS Central configuration
  central:
    ip: ""
    username: "admin"
    password: ""
  # UCS Manager credentials
  manager:
    username: "admin"
    password: ""
  # BMC credentials for Cisco CIMC
  bmc:
    username: "admin"
    password: ""
# Dell OME Configuration
dellOME:
  enabled: false
  # Dell OpenManage Enterprise IP
  ip: ""
  # Username for Dell OME
  username: "admin"
  # Password for Dell OME
  password: ""
  # BMC credentials for Dell iDRAC
  bmc:
    username: "root"
    password: "calvin"
# Cisco Intersight Configuration
# NOTE: uses the official 'intersight' Python SDK (bundled in the image via requirements.txt).
ciscoIntersight:
  enabled: false
  # Intersight endpoint (SaaS https://intersight.com or appliance URL)
  apiEndpoint: "https://intersight.com"
  # API key id from Intersight
  apiKeyId: ""
  # PEM private key text, or a path to the .pem file
  apiSecret: ""
  # BMC credentials for Cisco CIMC (Intersight-managed servers)
  bmc:
    username: "admin"
    password: ""
# Install CRD
crd:
  install: true
# Additional environment variables
extraEnv: []
# - name: CUSTOM_VAR
#   value: "custom-value"

# Additional volumes
extraVolumes: []
# Additional volume mounts
extraVolumeMounts: []
